    <circle cx="132" cy="515" r="30" fill="#EAF2F0" stroke="#0B3A53" stroke-width="2"/>
    <text x="132" y="522" text-anchor="middle" font-family="SimHei, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#0B3A53">03</text>
    <text x="266" y="500" font-family="SimHei, Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700" fill="#1E293B">后期安排</text>
