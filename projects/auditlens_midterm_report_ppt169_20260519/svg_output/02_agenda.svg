    <circle cx="132" cy="365" r="30" fill="#EAF2F0" stroke="#F59E0B" stroke-width="2"/>
    <text x="132" y="372" text-anchor="middle" font-family="SimHei, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#F59E0B">02</text>
