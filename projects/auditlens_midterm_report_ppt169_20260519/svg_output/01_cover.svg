<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0B3A53"/>
      <stop offset="100%" stop-color="#1F7A6D"/>
    </linearGradient>
  </defs>
  <g id="background">
    <rect x="0" y="0" width="1280" height="720" fill="#F8FAFC"/>
    <rect x="0" y="0" width="1280" height="14" fill="url(#headerGrad)"/>
    <rect x="56" y="640" width="1168" height="1" fill="#CBD5E1"/>
  </g>
  <g id="title-block">
    <rect x="56" y="92" width="88" height="8" rx="4" fill="#1F7A6D"/>
    <text x="56" y="170" font-family="SimHei, Microsoft YaHei, Arial, sans-serif" font-size="58" font-weight="700" fill="#0B3A53">
      <tspan x="56" dy="0">AuditLens</tspan>
      <tspan x="56" dy="74">财政监督工作台</tspan>
    </text>
    <text x="58" y="322" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#1E293B">
      <tspan>中期汇报：已完成工作、演示流程与后期进度安排</tspan>
    </text>
    <text x="58" y="362" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#64748B">
      <tspan>面向政府财政监督场景的可演示审计产品原型</tspan>
    </text>
  </g>
  <g id="status-badges">
    <rect x="56" y="436" width="160" height="72" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <use data-icon="tabler-outline/route" x="76" y="454" width="24" height="24" fill="#1F7A6D" stroke-width="2"/>
    <text x="114" y="475" font-family="SimHei, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#1E293B">主流程跑通</text>
    <rect x="248" y="436" width="160" height="72" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <use data-icon="tabler-outline/file-report" x="268" y="454" width="24" height="24" fill="#1F7A6D" stroke-width="2"/>
    <text x="306" y="475" font-family="SimHei, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#1E293B">可导出报告</text>
    <rect x="440" y="436" width="160" height="72" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <use data-icon="tabler-outline/rocket" x="460" y="454" width="24" height="24" fill="#F59E0B" stroke-width="2"/>
    <text x="498" y="475" font-family="SimHei, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#1E293B">PoC 可推进</text>
  </g>
  <g id="cover-visual-placeholder">
    <rect x="704" y="132" width="520" height="360" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect x="734" y="162" width="460" height="300" rx="8" fill="none" stroke="#1F7A6D" stroke-width="2" stroke-dasharray="8,4"/>
    <use data-icon="tabler-outline/photo" x="938" y="266" width="72" height="72" fill="#1F7A6D" stroke-width="2"/>
    <text x="964" y="360" text-anchor="middle" font-family="SimHei, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#0B3A53">项目截图占位</text>
    <text x="964" y="394" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#64748B">后续替换为系统首页、任务详情页或项目标识</text>
    <rect x="852" y="430" width="224" height="36" rx="18" fill="#1F7A6D"/>
    <text x="964" y="454" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#FFFFFF">图片位置已预留</text>
  </g>
  <g id="footer">
    <text x="56" y="681" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#64748B">项目中期答辩 | 2026-05-19</text>
    <text x="1224" y="681" text-anchor="end" font-family="Consolas, Courier New, monospace" font-size="11" fill="#94A3B8">01 / 08</text>
  </g>
</svg>
