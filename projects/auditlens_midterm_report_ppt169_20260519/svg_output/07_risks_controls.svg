<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="topGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0B3A53"/>
      <stop offset="100%" stop-color="#1F7A6D"/>
    </linearGradient>
  </defs>
  <g id="background">
    <rect x="0" y="0" width="1280" height="720" fill="#F8FAFC"/>
    <rect x="0" y="0" width="1280" height="14" fill="url(#topGrad)"/>
  </g>
  <g id="hero-statement">
    <text x="80" y="116" font-family="SimHei, Microsoft YaHei, Arial, sans-serif" font-size="32" font-weight="700" fill="#0B3A53">剩余工作重点不是继续堆功能</text>
    <text x="80" y="164" font-family="SimHei, Microsoft YaHei, Arial, sans-serif" font-size="32" font-weight="700" fill="#C2410C">而是把 PoC 交付边界做实</text>
    <rect x="80" y="188" width="520" height="4" rx="2" fill="#1F7A6D"/>
  </g>
  <g id="boundary-callout">
    <rect x="790" y="82" width="390" height="128" rx="8" fill="#0B3A53"/>
    <use data-icon="tabler-outline/shield-exclamation" x="830" y="112" width="36" height="36" fill="#FFFFFF" stroke-width="2"/>
    <text x="884" y="138" font-family="SimHei, Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">当前边界</text>
    <text x="884" y="174" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#FFFFFF">
      <tspan x="884" dy="0">演示闭环已经可跑通，真实交付还需要</tspan>
      <tspan x="884" dy="25">把安全、数据和解释责任说清楚。</tspan>
    </text>
  </g>
  <g id="risk-table-header">
    <line x1="80" y1="242" x2="1180" y2="242" stroke="#CBD5E1" stroke-width="2"/>
    <text x="80" y="270" font-family="SimHei, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#C2410C">待加固边界</text>
    <text x="660" y="270" font-family="SimHei, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#1F7A6D">控制方向</text>
  </g>
  <g id="risk-security">
    <line x1="80" y1="296" x2="1180" y2="296" stroke="#CBD5E1" stroke-width="1"/>
    <use data-icon="tabler-outline/lock-check" x="84" y="314" width="26" height="26" fill="#C2410C" stroke-width="2"/>
    <text x="122" y="326" font-family="SimHei, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#1E293B">安全合规</text>
    <text x="122" y="354" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#64748B">敏感配置、登录策略、关键操作审计仍需产品化固化</text>
    <text x="660" y="334" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#1E293B">迁移密钥管理，补齐高风险操作审计，明确日志保留周期</text>
  </g>
  <g id="risk-data">
    <line x1="80" y1="390" x2="1180" y2="390" stroke="#CBD5E1" stroke-width="1"/>
    <use data-icon="tabler-outline/database-import" x="84" y="408" width="26" height="26" fill="#C2410C" stroke-width="2"/>
    <text x="122" y="420" font-family="SimHei, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#1E293B">数据可信</text>
    <text x="122" y="448" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#64748B">真实样本导入需要更完整的来源、版本和解析摘要</text>
    <text x="660" y="428" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#1E293B">建立模板版本、字段映射版本、采集时间和校验摘要</text>
  </g>
  <g id="risk-rules">
    <line x1="80" y1="484" x2="1180" y2="484" stroke="#CBD5E1" stroke-width="1"/>
    <use data-icon="tabler-outline/file-check" x="84" y="502" width="26" height="26" fill="#C2410C" stroke-width="2"/>
    <text x="122" y="514" font-family="SimHei, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#1E293B">规则解释</text>
    <text x="122" y="542" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#64748B">规则命中需要说明为什么识别、证据来自哪里</text>
    <text x="660" y="522" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#1E293B">补齐规则说明字段、误报标记和固定样本回归用例</text>
  </g>
  <g id="risk-product">
    <line x1="80" y1="578" x2="1180" y2="578" stroke="#CBD5E1" stroke-width="1"/>
    <use data-icon="tabler-outline/settings-cog" x="84" y="596" width="26" height="26" fill="#C2410C" stroke-width="2"/>
    <text x="122" y="608" font-family="SimHei, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#1E293B">产品体验</text>
    <text x="122" y="636" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#64748B">部分导出、AI、证据附件能力仍需更清晰的 Web 入口</text>
    <text x="660" y="616" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#1E293B">补齐任务详情操作入口、错误反馈、权限不可用状态和台账导出</text>
  </g>
  <g id="footer">
    <text x="80" y="690" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" fill="#94A3B8">Source: docs/FUTURE_IMPROVEMENTS.md, docs/STATUS.md</text>
    <text x="1224" y="690" text-anchor="end" font-family="Consolas, Courier New, monospace" font-size="11" fill="#94A3B8">07 / 08</text>
  </g>
</svg>
