[package]
name = "auditlens"
version = "0.3.0"
edition = "2021"
authors = ["AuditLens Developer"]
description = "AuditLens governance-ready audit platform"
readme = "README.md"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
csv = "1"
encoding_rs = "0.8"
calamine = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde"] }
rust_decimal_macros = "1"
colored = "2"
thiserror = "1"
anyhow = "1"
rayon = "1"
toml = "0.8"

# Web server
actix-web = "4"
actix-files = "0.6"
actix-multipart = "0.7"
actix-session = { version = "0.9", features = ["cookie-session"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }

# Databases
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "mysql", "postgres", "chrono", "rust_decimal"] }
rusqlite = { version = "0.29", features = ["bundled"] }

# Password hashing
bcrypt = "0.15"

# PDF generation
printpdf = "0.7"

# Encryption
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"
sha2 = "0.10"
zip = { version = "2", default-features = false }
flate2 = "1"

# AI / HTTP client
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart"] }
regex = "1"

[dev-dependencies]
tempfile = "3"
